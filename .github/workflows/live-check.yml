name: Live site check
on:
  push:
    branches: [claude/live-check]
    paths: [".github/workflows/live-check.yml", "check.mjs", "ga.mjs", "live.mjs", "lh.sh", "lhsum.cjs", "live2.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: claude/omniroute-install-27bd6y
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Walk the quick guide on the live site and on the PR branch
        run: |
          mkdir -p shots
          (node live2.mjs; ./lh.sh) 2>&1 | tee report.txt
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add report.txt shots && git commit -m "Live site check screenshots" && git pull --rebase -q && git push
