name: Hero images
on:
  push:
    branches: [claude/live-check]
    paths: ['.github/workflows/img.yml', 'img.mjs']
permissions:
  contents: write
concurrency: { group: live-check-commit, cancel-in-progress: false }
jobs:
  img:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null && npm i sharp@0.33.5 >/dev/null && node img.mjs | tee img-report.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add img img-report.txt && git commit -m "Hero images" && git pull --rebase -q && git push
