# Blocks any push or pull request that would publish a credential (API key, token, private key, password,
# database connection string). Everything in this repository is served publicly by GitHub Pages.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the files in this commit
        run: python3 scripts/secret-scan.py
